# Generated by qaff (Phase 1.9 — GitHub Actions runner).
#
# Hard rules:
#   * No inline secrets in this file. The opt-in sync steps read the
#     user-managed repository secrets ZEPHYR_BASE_URL / ZEPHYR_TOKEN / TESTRAIL_URL / TESTRAIL_USER / TESTRAIL_API_KEY / JIRA_BASE_URL / JIRA_USER / JIRA_TOKEN;
#     nothing is stored in generated files. The opt-in run notification
#     step reads SLACK_WEBHOOK_URL / TEAMS_WEBHOOK_URL the same way.
#   * Opt-in test-management sync steps: Zephyr Scale Cloud (mode: live) / TestRail / Jira comment.
#     No test cases, runs or issues are created.
#   * No external test systems. The workflow runs Maven against the
#     generated reactor only.
#   * No Azure / cloud login. Deployment: opt-in GitHub Pages publish of the
#     Allure report (ci.githubActions.pagesPublish), main branch only.
#
# Triggers:
#   * push to main  — full Maven reactor, then the pages job publishes the
#     Allure report to GitHub Pages.
#   * pull_request  — full Maven reactor (mvn -B verify).
#   * workflow_dispatch — accepts application/layer/environment/suite/
#     browser/headless inputs. When both application and layer are
#     concrete (not "all"), the workflow narrows to
#     mvn -B -pl apps/<application>/<layer> -am verify.

name: qaff-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      application:
        description: "Generated application id (apps/<application>/...). Use 'all' for the full reactor."
        type: choice
        required: true
        default: all
        options: ["all", "demo-saas"]
      layer:
        description: "Generated layer for the selected application. Use 'all' for the full reactor."
        type: choice
        required: true
        default: all
        options: ["all", "web-desktop"]
      environment:
        description: "Logical environment label. Phase 1.9 does not wire any real environment."
        type: choice
        required: true
        default: local
        options: ["local", "dev", "staging"]
      suite:
        description: "JUnit 5 tag passed via -Dgroups. Leave empty to run every test."
        type: string
        required: false
        default: ""
      browser:
        description: "web-desktop browser id. Only chromium is wired today."
        type: choice
        required: true
        default: chromium
        options: ["chromium", "chrome", "firefox"]
      headless:
        description: "Run the browser headlessly (web-desktop only)."
        type: choice
        required: true
        default: "true"
        options: ["true", "false"]

permissions:
  contents: read

jobs:
  verify:
    name: mvn verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Print execution context
        run: |
          echo "event       = ${{ github.event_name }}"
          echo "application = ${{ inputs.application || 'all' }}"
          echo "layer       = ${{ inputs.layer || 'all' }}"
          echo "environment = ${{ inputs.environment || 'local' }}"
          echo "suite       = ${{ inputs.suite || '' }}"
          echo "browser     = ${{ inputs.browser || 'chromium' }}"
          echo "headless    = ${{ inputs.headless || 'true' }}"

      - name: Validate generated application/layer combination
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.application != 'all' && inputs.layer != 'all' }}
        run: |
          case "${{ inputs.application }}:${{ inputs.layer }}" in
            demo-saas:web-desktop) ;;
            *)
              echo "::error::Unsupported application/layer combination: ${{ inputs.application }} / ${{ inputs.layer }}"
              exit 1
              ;;
          esac

      - name: Run Maven verify
        env:
          # Adjust to wherever your runner has chromium installed.
          # ubuntu-latest ships /usr/bin/chromium-browser.
          BROWSER_BINARY: /usr/bin/chromium-browser
        run: |
          set -e
          APP="${{ inputs.application || 'all' }}"
          LAYER="${{ inputs.layer || 'all' }}"
          SUITE="${{ inputs.suite || '' }}"
          BROWSER="${{ inputs.browser || 'chromium' }}"
          HEADLESS="${{ inputs.headless || 'true' }}"
          MAVEN_OPTS_EXTRA=""
          if [ -n "$SUITE" ]; then
            MAVEN_OPTS_EXTRA="$MAVEN_OPTS_EXTRA -Dgroups=$SUITE"
          fi
          MAVEN_OPTS_EXTRA="$MAVEN_OPTS_EXTRA -Dbrowser.name=$BROWSER -Dbrowser.headless=$HEADLESS"
          if [ "$APP" != "all" ] && [ "$LAYER" != "all" ]; then
            MODULE="apps/$APP/$LAYER"
            echo "Building selected module: $MODULE"
            mvn -B -ntp -pl "$MODULE" -am verify $MAVEN_OPTS_EXTRA
          else
            echo "Building full Maven reactor"
            mvn -B -ntp verify $MAVEN_OPTS_EXTRA
          fi




      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: "**/target/allure-results/**"
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Allure HTML report
        if: always()
        run: bash scripts/allure-report.sh

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          if-no-files-found: ignore
          retention-days: 7


      - name: Sync Allure results to Zephyr Scale Cloud
        if: always()
        env:
          ZEPHYR_BASE_URL: ${{ secrets.ZEPHYR_BASE_URL }}
          ZEPHYR_TOKEN: ${{ secrets.ZEPHYR_TOKEN }}
          ZEPHYR_PROJECT_KEY: ${{ vars.ZEPHYR_PROJECT_KEY || 'DEMO' }}
          ZEPHYR_CYCLE_KEY: ${{ vars.ZEPHYR_CYCLE_KEY || '' }}
        run: |
          set -e
          export PATH="$HOME/.qaff/node/bin:$HOME/.qaff/bin:$PATH"
          if ! command -v qaff >/dev/null 2>&1; then
            if ! command -v npm >/dev/null 2>&1; then
              mkdir -p "$HOME/.qaff/node"
              curl -fsSL https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.gz | tar -xz -C "$HOME/.qaff/node" --strip-components=1
            fi
            npm install -g --prefix "$HOME/.qaff" ./qa-framework-factory-cli-0.2.0.tgz
          fi
          if ! command -v qaff >/dev/null 2>&1; then
            echo "qaff CLI not found on PATH — skipping the Zephyr Scale sync. Install qaff in an earlier step to enable it."
            exit 0
          fi
          PROJECT_KEY="$ZEPHYR_PROJECT_KEY"
          if [ -z "$PROJECT_KEY" ]; then
            echo "::error::ZEPHYR_PROJECT_KEY must be configured as a repository variable or integrations.zephyr.projectKey."
            exit 1
          fi
          CYCLE_ARG=""
          if [ -n "$ZEPHYR_CYCLE_KEY" ]; then
            CYCLE_ARG="--cycle-key $ZEPHYR_CYCLE_KEY"
          fi
          SYNC_APP="${{ inputs.application || 'demo-saas' }}"
          if [ "$SYNC_APP" = "all" ]; then
            SYNC_APP="demo-saas"
          fi
          qaff sync-zephyr-results --project . --app "$SYNC_APP" --project-key "$PROJECT_KEY" $CYCLE_ARG --mode live --mapping config/zephyr-mapping.json --force --json

      # Opt-in TestRail sync (ci.githubActions.testrailSync): qaff sync-test-results --mode live.
      - name: Sync Allure results to TestRail
        if: always()
        env:
          TESTRAIL_URL: ${{ secrets.TESTRAIL_URL }}
          TESTRAIL_USER: ${{ secrets.TESTRAIL_USER }}
          TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
        run: |
          set -e
          export PATH="$HOME/.qaff/node/bin:$HOME/.qaff/bin:$PATH"
          if ! command -v qaff >/dev/null 2>&1; then
            if ! command -v npm >/dev/null 2>&1; then
              mkdir -p "$HOME/.qaff/node"
              curl -fsSL https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.gz | tar -xz -C "$HOME/.qaff/node" --strip-components=1
            fi
            npm install -g --prefix "$HOME/.qaff" ./qa-framework-factory-cli-0.2.0.tgz
          fi
          if ! command -v qaff >/dev/null 2>&1; then
            echo "qaff CLI not found on PATH — skipping the TestRail sync. Install qaff in an earlier step to enable it."
            exit 0
          fi
          SYNC_APP="${{ inputs.application || 'demo-saas' }}"
          if [ "$SYNC_APP" = "all" ]; then
            SYNC_APP="demo-saas"
          fi
          qaff sync-test-results --provider testrail --project . --app "$SYNC_APP" --run-id 1 --mapping config/testrail-mapping.json --mode live --force --json
      # Opt-in Jira comment sync (ci.githubActions.jiraComment): qaff sync-test-results --mode live.
      - name: Comment test results on Jira
        if: always()
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          QAFF_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          export PATH="$HOME/.qaff/node/bin:$HOME/.qaff/bin:$PATH"
          if ! command -v qaff >/dev/null 2>&1; then
            if ! command -v npm >/dev/null 2>&1; then
              mkdir -p "$HOME/.qaff/node"
              curl -fsSL https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.gz | tar -xz -C "$HOME/.qaff/node" --strip-components=1
            fi
            npm install -g --prefix "$HOME/.qaff" ./qa-framework-factory-cli-0.2.0.tgz
          fi
          if ! command -v qaff >/dev/null 2>&1; then
            echo "qaff CLI not found on PATH — skipping the Jira comment sync. Install qaff in an earlier step to enable it."
            exit 0
          fi
          SYNC_APP="${{ inputs.application || 'demo-saas' }}"
          if [ "$SYNC_APP" = "all" ]; then
            SYNC_APP="demo-saas"
          fi
          qaff sync-test-results --provider jira-comment --project . --app "$SYNC_APP" --issue-key DEMO-1 ${QAFF_RUN_URL:+--run-url "$QAFF_RUN_URL"} --mode live --force --json


      # Quality Impact Pack is not enabled in this generated project,
      # so framework-performance/reports/ does not exist. Nothing to upload.

      # Opt-in run notification (ci.githubActions.notify): one message per
      # provider via qaff notify-run. Never changes the job result.
      - name: Notify run result (Slack / Teams)
        if: always()
        env:
          QAFF_JOB_STATUS: ${{ job.status }}
          QAFF_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          if [ "$QAFF_JOB_STATUS" = "success" ]; then QAFF_RUN_STATUS=success; else QAFF_RUN_STATUS=failure; fi
          export PATH="$HOME/.qaff/node/bin:$HOME/.qaff/bin:$PATH"
          if ! command -v qaff >/dev/null 2>&1; then
            if ! command -v npm >/dev/null 2>&1; then
              mkdir -p "$HOME/.qaff/node"
              curl -fsSL https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.gz | tar -xz -C "$HOME/.qaff/node" --strip-components=1
            fi
            npm install -g --prefix "$HOME/.qaff" ./qa-framework-factory-cli-0.2.0.tgz
          fi
          if ! command -v qaff >/dev/null 2>&1; then
            echo "qaff CLI not found on PATH — skipping the run notification. Install qaff (or set ci.qaffInstall) to enable it."
            exit 0
          fi
          qaff notify-run --project . --provider slack --status "$QAFF_RUN_STATUS" ${QAFF_RUN_URL:+--run-url "$QAFF_RUN_URL"} --mode live --force --json || echo "Slack notification failed — the build result is unchanged."
          qaff notify-run --project . --provider teams --status "$QAFF_RUN_STATUS" ${QAFF_RUN_URL:+--run-url "$QAFF_RUN_URL"} --mode live --force --json || echo "Teams notification failed — the build result is unchanged."

  # Opt-in Allure report publish (ci.githubActions.pagesPublish). Runs on main
  # only — also after failed tests, so a red build still publishes its report.
  # Only this job gets the Pages permissions; verify keeps contents: read.
  pages:
    name: Publish Allure report to GitHub Pages
    needs: verify
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.verify.result != 'cancelled' && needs.verify.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Allure HTML report
        uses: actions/download-artifact@v8
        with:
          name: allure-report
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
