# Generated by qaff (Phase 14 — Azure Pipelines)
# Opt-in test-management sync (ci.azurePipelines): Zephyr Scale / TestRail / Jira comment after the tests;
# credentials come only from the CI secret variable(s) ZEPHYR_BASE_URL / ZEPHYR_TOKEN / TESTRAIL_URL / TESTRAIL_USER / TESTRAIL_API_KEY / JIRA_BASE_URL / JIRA_USER / JIRA_TOKEN.
# Opt-in run notification (ci.azurePipelines.notify): the final step posts one Slack / Teams message;
# the webhook URL comes only from the CI secret SLACK_WEBHOOK_URL / TEAMS_WEBHOOK_URL.
# No inline secrets, no deployment, no other Jira/Zephyr/Xray/TestRail integration.

trigger:
- main

pr:
- "*"

parameters:
  - name: APPLICATION
    displayName: "Application id (apps/<application>/...). Use 'all' for the full reactor."
    type: string
    default: all
    values:
      - all
      - demo-saas
  - name: LAYER
    displayName: "Layer for the selected application. Use 'all' for the full reactor."
    type: string
    default: all
    values:
      - all
      - web-desktop
  - name: ENVIRONMENT
    displayName: "Logical environment label. Phase 14 does not wire any real environment."
    type: string
    default: local
    values:
      - local
      - dev
      - staging
  - name: SUITE
    displayName: "JUnit 5 tag expression passed via -Dgroups. Leave empty to run every test."
    type: string
    default: ""
  - name: BROWSER
    displayName: "web-desktop browser id. Only chromium is wired today."
    type: string
    default: chromium
    values:
      - chromium
      - chrome
      - firefox
  - name: HEADLESS
    displayName: "Run the browser headlessly (web-desktop only)."
    type: string
    default: "true"
    values:
      - "true"
      - "false"

pool:
  name: Default

steps:
  - checkout: self

  - task: JavaToolInstaller@0
    displayName: Set up JDK 21
    inputs:
      versionSpec: "21"
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - script: |
      set -e
      case "${{ parameters.APPLICATION }}:${{ parameters.LAYER }}" in
        "all:all") ;;
      "demo-saas:web-desktop") ;;
        *)
          if [ "${{ parameters.APPLICATION }}" = "all" ] || [ "${{ parameters.LAYER }}" = "all" ]; then
            :
          else
            echo "Unsupported APPLICATION/LAYER combination: ${{ parameters.APPLICATION }} / ${{ parameters.LAYER }}"
            exit 1
          fi
          ;;
      esac
    displayName: Validate generated application/layer combination

  - script: |
      set -e
      APP="${{ parameters.APPLICATION }}"
      LAYER="${{ parameters.LAYER }}"
      SUITE="${{ parameters.SUITE }}"
      BROWSER="${{ parameters.BROWSER }}"
      HEADLESS="${{ parameters.HEADLESS }}"
      EXTRA=""
      if [ -n "$SUITE" ]; then
        EXTRA="$EXTRA -Dgroups=$SUITE"
      fi
      EXTRA="$EXTRA -Dbrowser.name=$BROWSER -Dbrowser.headless=$HEADLESS"
      if [ "$APP" != "all" ] && [ "$LAYER" != "all" ]; then
        MODULE="apps/$APP/$LAYER"
        mvn -B -ntp -pl "$MODULE" -am verify $EXTRA
      else
        mvn -B -ntp verify $EXTRA
      fi
    displayName: Run Maven verify

  - task: PublishTestResults@2
    displayName: Publish Surefire results
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: "**/target/surefire-reports/*.xml"
      failTaskOnFailedTests: false

  - task: CopyFiles@2
    displayName: Stage Allure raw results
    condition: always()
    inputs:
      SourceFolder: $(Build.SourcesDirectory)
      Contents: '**/target/allure-results/**'
      TargetFolder: $(Build.ArtifactStagingDirectory)/allure-results

  - task: PublishPipelineArtifact@1
    displayName: Publish Allure raw results
    condition: always()
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/allure-results
      artifact: allure-results-scan-root
      publishLocation: pipeline

  - script: bash scripts/allure-report.sh
    displayName: Build Allure HTML report
    condition: always()

  - task: PublishPipelineArtifact@1
    displayName: Publish Allure HTML report
    condition: always()
    continueOnError: true
    inputs:
      targetPath: target/site/allure-maven-plugin
      artifact: allure-report
      publishLocation: pipeline

  # Opt-in Zephyr Scale sync (ci.azurePipelines.zephyrSync): qaff sync-zephyr-results.
  # Secret variables are not exported automatically, hence env:.
  - script: |
      set -e
      export PATH="$HOME/.qaff/node/bin:$HOME/.qaff/bin:$PATH"
      if ! command -v qaff >/dev/null 2>&1; then
        if ! command -v npm >/dev/null 2>&1; then
          mkdir -p "$HOME/.qaff/node"
          curl -fsSL https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.gz | tar -xz -C "$HOME/.qaff/node" --strip-components=1
        fi
        npm install -g --prefix "$HOME/.qaff" ./qa-framework-factory-cli-0.2.0.tgz
      fi
      if ! command -v qaff >/dev/null 2>&1; then
        echo "qaff CLI not found on PATH — skipping the Zephyr Scale sync. Install qaff in an earlier step (or set ci.qaffInstall) to enable it."
        exit 0
      fi
      PROJECT_KEY="${ZEPHYR_PROJECT_KEY:-DEMO}"
      if [ -z "$PROJECT_KEY" ]; then
        echo "ZEPHYR_PROJECT_KEY must be configured as a CI variable or integrations.zephyr.projectKey."
        exit 1
      fi
      ZEPHYR_CYCLE_KEY="${ZEPHYR_CYCLE_KEY:-}"
      CYCLE_ARG=""
      if [ -n "$ZEPHYR_CYCLE_KEY" ]; then
        CYCLE_ARG="--cycle-key $ZEPHYR_CYCLE_KEY"
      fi
      SYNC_APP="${{ parameters.APPLICATION }}"
      if [ "$SYNC_APP" = "all" ]; then
        SYNC_APP="demo-saas"
      fi
      qaff sync-zephyr-results --project . --app "$SYNC_APP" --project-key "$PROJECT_KEY" $CYCLE_ARG --mode dry-run --force --json
    displayName: Sync Allure results to Zephyr Scale Cloud
    condition: always()
    env:
      ZEPHYR_BASE_URL: $(ZEPHYR_BASE_URL)
      ZEPHYR_TOKEN: $(ZEPHYR_TOKEN)

  # Opt-in TestRail sync (ci.azurePipelines.testrailSync): qaff sync-test-results --mode live.
  # Secret variables are not exported automatically, hence env:.
  - script: |
      set -e
      export PATH="$HOME/.qaff/node/bin:$HOME/.qaff/bin:$PATH"
      if ! command -v qaff >/dev/null 2>&1; then
        if ! command -v npm >/dev/null 2>&1; then
          mkdir -p "$HOME/.qaff/node"
          curl -fsSL https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.gz | tar -xz -C "$HOME/.qaff/node" --strip-components=1
        fi
        npm install -g --prefix "$HOME/.qaff" ./qa-framework-factory-cli-0.2.0.tgz
      fi
      if ! command -v qaff >/dev/null 2>&1; then
        echo "qaff CLI not found on PATH — skipping the TestRail sync. Install qaff in an earlier step (or set ci.qaffInstall) to enable it."
        exit 0
      fi
      SYNC_APP="${{ parameters.APPLICATION }}"
      if [ "$SYNC_APP" = "all" ]; then
        SYNC_APP="demo-saas"
      fi
      qaff sync-test-results --provider testrail --project . --app "$SYNC_APP" --run-id 1 --mapping config/testrail-mapping.json --mode live --force --json
    displayName: Sync Allure results to TestRail
    condition: always()
    env:
      TESTRAIL_URL: $(TESTRAIL_URL)
      TESTRAIL_USER: $(TESTRAIL_USER)
      TESTRAIL_API_KEY: $(TESTRAIL_API_KEY)

  # Opt-in Jira comment sync (ci.azurePipelines.jiraComment): qaff sync-test-results --mode live.
  # Secret variables are not exported automatically, hence env:.
  - script: |
      set -e
      export PATH="$HOME/.qaff/node/bin:$HOME/.qaff/bin:$PATH"
      if ! command -v qaff >/dev/null 2>&1; then
        if ! command -v npm >/dev/null 2>&1; then
          mkdir -p "$HOME/.qaff/node"
          curl -fsSL https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.gz | tar -xz -C "$HOME/.qaff/node" --strip-components=1
        fi
        npm install -g --prefix "$HOME/.qaff" ./qa-framework-factory-cli-0.2.0.tgz
      fi
      if ! command -v qaff >/dev/null 2>&1; then
        echo "qaff CLI not found on PATH — skipping the Jira comment sync. Install qaff in an earlier step (or set ci.qaffInstall) to enable it."
        exit 0
      fi
      QAFF_RUN_URL="$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
      SYNC_APP="${{ parameters.APPLICATION }}"
      if [ "$SYNC_APP" = "all" ]; then
        SYNC_APP="demo-saas"
      fi
      qaff sync-test-results --provider jira-comment --project . --app "$SYNC_APP" --issue-key DEMO-1 ${QAFF_RUN_URL:+--run-url "$QAFF_RUN_URL"} --mode live --force --json
    displayName: Comment test results on Jira
    condition: always()
    env:
      JIRA_BASE_URL: $(JIRA_BASE_URL)
      JIRA_USER: $(JIRA_USER)
      JIRA_TOKEN: $(JIRA_TOKEN)

  # Opt-in run notification (ci.azurePipelines.notify): one message per provider
  # via qaff notify-run. Secret variables are not exported automatically, hence env:.
  - script: |
      case "$QAFF_JOB_STATUS" in Succeeded|SucceededWithIssues) QAFF_RUN_STATUS=success ;; *) QAFF_RUN_STATUS=failure ;; esac
      export PATH="$HOME/.qaff/node/bin:$HOME/.qaff/bin:$PATH"
      if ! command -v qaff >/dev/null 2>&1; then
        if ! command -v npm >/dev/null 2>&1; then
          mkdir -p "$HOME/.qaff/node"
          curl -fsSL https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.gz | tar -xz -C "$HOME/.qaff/node" --strip-components=1
        fi
        npm install -g --prefix "$HOME/.qaff" ./qa-framework-factory-cli-0.2.0.tgz
      fi
      if ! command -v qaff >/dev/null 2>&1; then
        echo "qaff CLI not found on PATH — skipping the run notification. Install qaff (or set ci.qaffInstall) to enable it."
        exit 0
      fi
      qaff notify-run --project . --provider slack --status "$QAFF_RUN_STATUS" ${QAFF_RUN_URL:+--run-url "$QAFF_RUN_URL"} --mode live --force --json || echo "Slack notification failed — the build result is unchanged."
      qaff notify-run --project . --provider teams --status "$QAFF_RUN_STATUS" ${QAFF_RUN_URL:+--run-url "$QAFF_RUN_URL"} --mode live --force --json || echo "Teams notification failed — the build result is unchanged."
    displayName: Notify run result (Slack / Teams)
    condition: always()
    env:
      QAFF_JOB_STATUS: $(Agent.JobStatus)
      QAFF_RUN_URL: $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)
      SLACK_WEBHOOK_URL: $(SLACK_WEBHOOK_URL)
      TEAMS_WEBHOOK_URL: $(TEAMS_WEBHOOK_URL)
